<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>404 - Page Not Found | Blush & Bloom</title>

    <link rel="stylesheet" href="404.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">

    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">

    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --pcolor: #D17474;
    --dark: #0d0d0d;
    --light-pink: #e6a1a1;
    --text: #ffffff;
    --muted: #aaa;
}

body {
    min-height: 100vh;
    font-family: "DM Sans", sans-serif;
    background: #171516;
    color: var(--text);
    overflow: hidden;
}


/* Background */

.beauty-bg {
    position: fixed;
    inset: 0;

    background:
        radial-gradient(
            circle at 20% 50%,
            rgba(209, 116, 116, 0.18),
            transparent 35%
        ),
        radial-gradient(
            circle at 80% 30%,
            rgba(209, 116, 116, 0.13),
            transparent 35%
        ),
        linear-gradient(
            135deg,
            #171516,
            #0c0c0c
        );

    z-index: -3;
}


/* Particles */

.particles {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: -1;
}

.particle {
    position: absolute;

    width: 4px;
    height: 4px;

    background: var(--pcolor);

    border-radius: 50%;

    opacity: 0.35;

    animation: floatParticle linear infinite;
}

@keyframes floatParticle {

    0% {
        transform: translateY(100vh) scale(0);
        opacity: 0;
    }

    20% {
        opacity: 0.4;
    }

    80% {
        opacity: 0.4;
    }

    100% {
        transform: translateY(-20vh) scale(1);
        opacity: 0;
    }
}


/* Main */

.error-page {
    width: min(1100px, 90%);
    min-height: 100vh;

    margin: auto;

    display: grid;
    grid-template-columns: 1.2fr 0.8fr;

    align-items: center;

    gap: 80px;
}


/* Left Content */

.error-content {
    position: relative;
    z-index: 2;
}


/* Brand */

.brand {
    display: flex;
    align-items: center;
    gap: 10px;

    margin-bottom: 25px;

    font-size: 18px;
    font-weight: 700;
    letter-spacing: 2px;
}



/* 404 */

.error-number {
    font-size: clamp(130px, 18vw, 230px);

    line-height: 0.8;

    font-weight: 700;

    letter-spacing: -15px;

    color: transparent;

    -webkit-text-stroke: 2px var(--pcolor);

    text-shadow:
        0 0 35px rgba(209, 116, 116, 0.12);

    margin-left: -12px;
}

.error-number span {
    color: var(--pcolor);

    -webkit-text-stroke: 0;

    font-family: "Playfair Display", serif;

    font-style: italic;
}


/* Heading */

h1 {
    margin-top: 35px;

    font-family: "Playfair Display", serif;

    font-size: clamp(38px, 4vw, 58px);

    font-weight: 500;

    line-height: 1.1;
}

.error-content > p {
    max-width: 560px;

    margin-top: 18px;

    color: var(--muted);

    font-size: 15px;

    line-height: 1.8;
}


/* Buttons */

.error-buttons {
    display: flex;
    align-items: center;

    gap: 15px;

    margin-top: 32px;
}

.home-btn,
.back-btn {
    height: 52px;

    padding: 0 25px;

    display: inline-flex;
    align-items: center;
    justify-content: center;

    gap: 8px;

    border-radius: 5px;

    font-family: "DM Sans", sans-serif;

    font-size: 13px;
    font-weight: 600;

    text-transform: uppercase;

    cursor: pointer;

    transition: all 0.3s ease;
}


/* Home */

.home-btn {
    background: var(--pcolor);

    color: white;

    text-decoration: none;

    border: 1px solid var(--pcolor);

    box-shadow: 0 8px 25px rgba(209, 116, 116, 0.2);
}

.home-btn:hover {
    background: #b85f5f;

    transform: translateY(-4px);

    box-shadow:
        0 12px 30px rgba(209, 116, 116, 0.3);
}


/* Back */

.back-btn {
    background: transparent;

    color: white;

    border: 1px solid #444;
}

.back-btn:hover {
    border-color: var(--pcolor);

    color: var(--pcolor);

    transform: translateY(-4px);
}


/* Beauty message */

.beauty-message {
    display: flex;
    align-items: center;
    gap: 12px;

    margin-top: 45px;

    color: #888;

    font-family: "Playfair Display", serif;

    font-style: italic;

    font-size: 14px;
}

.beauty-message span {
    width: 45px;
    height: 1px;

    background: #444;
}


/* Right Card */

.beauty-card {
    position: relative;

    height: 480px;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;

    border-radius: 8px;

    background:
        linear-gradient(
            145deg,
            rgba(209, 116, 116, 0.25),
            rgba(20, 20, 20, 0.95)
        );

    border: 1px solid rgba(209, 116, 116, 0.25);

    box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.45);
}


/* Decorative circles */

.card-circle {
    position: absolute;

    border-radius: 50%;

    border: 1px solid rgba(209, 116, 116, 0.25);
}

.circle-one {
    width: 360px;
    height: 360px;

    top: -150px;
    right: -150px;
}

.circle-two {
    width: 250px;
    height: 250px;

    bottom: -110px;
    left: -100px;
}


/* Card content */

.card-content {
    position: relative;

    text-align: center;

    max-width: 280px;

    z-index: 2;
}

.sparkle-icon {
    width: 75px;
    height: 75px;

    margin: 0 auto 25px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background: rgba(209, 116, 116, 0.12);

    border: 1px solid rgba(209, 116, 116, 0.35);

    color: var(--pcolor);

    animation: sparkle 2s ease-in-out infinite;
}

.sparkle-icon span {
    font-size: 34px;
}

@keyframes sparkle {

    0%,
    100% {
        transform: scale(1);
        box-shadow: 0 0 0 rgba(209, 116, 116, 0);
    }

    50% {
        transform: scale(1.08);
        box-shadow: 0 0 35px rgba(209, 116, 116, 0.2);
    }
}


.card-content h2 {
    font-family: "Playfair Display", serif;

    font-size: 50px;

    font-weight: 500;

    color: white;
}

.card-content p {
    margin-top: 12px;

    color: #aaa;

    font-size: 14px;

    line-height: 1.7;
}


/* Cosmetic icons */

.cosmetic-icons {
    display: flex;

    justify-content: center;

    gap: 12px;

    margin-top: 30px;
}

.cosmetic-icons div {
    width: 45px;
    height: 45px;

    display: flex;
    align-items: center;
    justify-content: center;

    border: 1px solid #3d3d3d;

    color: var(--pcolor);

    border-radius: 50%;

    transition: 0.3s;
}

.cosmetic-icons div:hover {
    background: var(--pcolor);

    color: white;

    border-color: var(--pcolor);

    transform: translateY(-5px);
}


/* Responsive */

@media (max-width: 900px) {

    body {
        overflow: auto;
    }

    .error-page {
        grid-template-columns: 1fr;

        padding: 70px 0;

        gap: 50px;

        min-height: auto;
    }

    .error-content {
        text-align: center;
    }

    .brand {
        justify-content: center;
    }

    .error-number {
        font-size: 150px;

        letter-spacing: -10px;
    }

    .error-content > p {
        margin-left: auto;
        margin-right: auto;
    }

    .error-buttons {
        justify-content: center;
    }

    .beauty-message {
        justify-content: center;
    }

    .beauty-card {
        height: 380px;
    }
}


@media (max-width: 500px) {

    .error-page {
        width: 90%;

        padding: 50px 0;
    }

    .error-number {
        font-size: 105px;

        letter-spacing: -7px;
    }

    h1 {
        font-size: 34px;

        margin-top: 28px;
    }

    .error-content > p {
        font-size: 14px;
    }

    .error-buttons {
        flex-direction: column;
    }

    .home-btn,
    .back-btn {
        width: 100%;
    }

    .beauty-card {
        height: 340px;
    }

    .card-content h2 {
        font-size: 42px;
    }
}


 .companylogo{
        width: clamp(150px,17vw,200px);
    }
    </style>
</head>

<body>

    <div class="beauty-bg"></div>

    <!-- Floating particles -->
    <div class="particles"></div>

    <main class="error-page">

        <div class="error-content">

            <div class="brand">
                <a href="index.html"><img src="./src/logo.webp" alt="company logo" class="companylogo"></a>
            </div>

            <div class="error-number">
                4<span>0</span>4
            </div>

            <h1>Beauty Page Not Found</h1>

            <p>
                It looks like this beauty page has gone missing.
                Don't worry, let's get you back to your beauty journey.
            </p>

            <div class="error-buttons">

                <a href="index.html" class="home-btn">
                    <span class="material-symbols-outlined">home</span>
                    Back to Home
                </a>

                <button class="back-btn" id="backBtn">
                    <span class="material-symbols-outlined">arrow_back</span>
                    Go Back
                </button>

            </div>

            <div class="beauty-message">
                <span></span>
                Beauty begins with confidence
                <span></span>
            </div>

        </div>

        <div class="beauty-card">

            <div class="card-circle circle-one"></div>
            <div class="card-circle circle-two"></div>

            <div class="card-content">

                <div class="sparkle-icon">
                    <span class="material-symbols-outlined">
                        auto_awesome
                    </span>
                </div>

                <h2>Oops!</h2>

                <p>
                    Your perfect beauty destination
                    is just one click away.
                </p>

                <div class="cosmetic-icons">

                    <div>
                        <span class="material-symbols-outlined">
                            face_3
                        </span>
                    </div>

                    <div>
                        <span class="material-symbols-outlined">
                            auto_awesome
                        </span>
                    </div>

                    <div>
                        <span class="material-symbols-outlined">
                            favorite
                        </span>
                    </div>

                </div>

            </div>

        </div>

    </main>

    <script>
        // ==========================================
// BACK BUTTON
// ==========================================

const backBtn = document.querySelector("#backBtn");

backBtn.addEventListener("click", () => {

    if (window.history.length > 1) {
        window.history.back();
    } else {
        window.location.href = "index.html";
    }

});


// ==========================================
// FLOATING BEAUTY PARTICLES
// ==========================================

const particlesContainer = document.querySelector(".particles");

for (let i = 0; i < 30; i++) {

    const particle = document.createElement("span");

    particle.classList.add("particle");

    particle.style.left = Math.random() * 100 + "%";

    particle.style.animationDuration =
        (5 + Math.random() * 8) + "s";

    particle.style.animationDelay =
        Math.random() * 5 + "s";

    const size = 2 + Math.random() * 4;

    particle.style.width = size + "px";
    particle.style.height = size + "px";

    particlesContainer.appendChild(particle);
}


// ==========================================
// 404 NUMBER HOVER EFFECT
// ==========================================

const errorNumber = document.querySelector(".error-number");

errorNumber.addEventListener("mouseenter", () => {

    errorNumber.style.transform = "scale(1.03)";
    errorNumber.style.transition = "0.4s ease";

});

errorNumber.addEventListener("mouseleave", () => {

    errorNumber.style.transform = "scale(1)";

});
    </script>

</body>
</html>
